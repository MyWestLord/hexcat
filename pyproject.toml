[project]
name = "hexcat"
version = "0.1.0"
description = "The pump.fun bot with 9 lives. 8 tarot cards per coin. Rugs get tombstones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "websockets>=12", "rich>=13", "pyyaml>=6"]

[project.optional-dependencies]
live = ["solders>=0.21"]
dev = ["pytest>=8"]

[project.scripts]
hexcat = "hexcat.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
